<title>송그와트 마법학교 기숙사 배정식</title>
<style>
:root{--bg:#070910;--panel:#111522e8;--gold:#d8b56a;--gold2:#f4dda2;--text:#f6f0e5;--muted:#b9b4aa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#251d3c 0,#0b0e18 35%,#05070d 80%);color:var(--text);font-family:Georgia,"Noto Serif KR",serif}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:43px 43px;opacity:.07;pointer-events:none}
.app{min-height:100vh;display:grid;place-items:center;padding:20px}.screen{display:none;width:min(680px,100%)}.screen.active{display:block;animation:fade .55s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.card{background:linear-gradient(145deg,#151a2beF,#090c15f2);border:1px solid #d8b56a55;border-radius:22px;padding:34px 24px;text-align:center;box-shadow:0 28px 90px #0009,inset 0 0 70px #d8b56a08}
.kicker{color:var(--gold);font-size:12px;letter-spacing:.22em}.crest,.hat{font-size:76px;margin:4px}.hat{animation:float 2.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
h1{font-size:clamp(34px,9vw,56px);line-height:1.12;margin:10px 0 14px;letter-spacing:.04em}h2{font-size:26px}.lead{color:#cbc6bb;line-height:1.85}
.field{margin:12px 0;text-align:left}.field label{display:block;color:var(--gold2);font-size:13px;margin:0 0 6px 4px}
select,input{width:100%;padding:15px 14px;border-radius:11px;border:1px solid #d8b56a66;background:#ffffff08;color:white;font:inherit;outline:none}select option{color:#111}
button{width:100%;margin-top:14px;padding:15px;border:1px solid var(--gold);border-radius:11px;background:linear-gradient(#e0bf79,#a77f37);font:700 16px inherit;color:#18130b;cursor:pointer}
.error{color:#f2a9a9;min-height:24px;margin-top:8px}.question{font-size:23px;line-height:1.55;margin:18px 0 24px}.qno{color:var(--gold);letter-spacing:.14em;font-size:12px}
.options{display:grid;gap:10px;text-align:left}.option{padding:16px;border:1px solid #ffffff22;border-radius:12px;background:#ffffff08;cursor:pointer}.option:hover{border-color:var(--gold);background:#d8b56a14}
.rune{font-size:42px;color:var(--gold);animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.house{font-size:clamp(36px,10vw,58px);color:var(--gold2);margin:8px}.housecrest{font-size:90px}.quote{color:#d7d0c3;line-height:1.8}.small{color:#8e8d93;font-size:12px}
@media(max-width:430px){.app{padding:10px}.card{padding:28px 17px;min-height:650px;display:flex;flex-direction:column;justify-content:center}.question{font-size:21px}}
</style></head><body><div class="app">
<section id="start" class="screen active"><div class="card"><div class="crest">✦</div><div class="kicker">AJOU UNIVERSITY MEDICAL SCHOOL FESTIVAL</div><h1>송그와트 마법학교<br>기숙사 배정식</h1><p class="lead">학번과 이름을 입력한 뒤 마법모자의 네 가지 질문에 답해주세요.</p>
<div class="field"><label>학번</label><input id="studentId" inputmode="numeric" placeholder="학번을 입력하세요 (ex. 2026xxxxx)" autocomplete="off"></div>
<div class="field"><label>이름</label><input id="name" placeholder="이름을 입력하세요" autocomplete="off"></div><div id="error" class="error"></div><button onclick="begin()">입학식 시작</button></div></section>
<section id="intro" class="screen"><div class="card"><div class="hat">🎩</div><div class="kicker">THE SORTING HAT</div><h2 id="hello"></h2><p class="lead">마법모자가 당신을 살펴봅니다.<br>네 가지 질문에 솔직하게 답해주세요.</p><button onclick="nextQuestion()">마법모자 쓰기</button></div></section>
<section id="quiz" class="screen"><div class="card"><div class="qno" id="qno"></div><div class="question" id="qtext"></div><div class="options" id="options"></div></div></section>
<section id="thinking" class="screen"><div class="card"><div class="hat">🎩</div><div class="rune">✧</div><h2 id="thinkingText">흠…… 흥미로운 선택이군.</h2><p class="lead">마법모자가 당신의 답을 읽고 있습니다.</p></div></section>
<section id="result" class="screen"><div class="card"><div class="kicker">THE RESULT OF YOUR CEREMONY</div><div class="housecrest" id="houseCrest"></div><div class="house" id="houseName"></div><p class="quote" id="houseQuote"></p><p id="studentResult"></p><p class="small">마법학교의 명부에 당신의 이름이 기록되었습니다.</p><button onclick="location.reload()">처음으로 돌아가기</button></div></section>

function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function begin(){const studentId=document.getElementById("studentId").value.trim().replace(/\\s+/g,"");const name=document.getElementById("name").value.trim().replace(/\\s+/g,"");const err=document.getElementById("error");err.textContent="";if(!studentId||!name){err.textContent="학번과 이름을 모두 입력해주세요.";return}
const matches=roster.filter(x=>String(x.studentId)===studentId&&x.displayName.replace(/\\s+/g,"")===name);if(matches.length===0){err.textContent="참여 명단에서 해당 학생을 찾을 수 없습니다. 학번과 이름을 확인해주세요.";return}student=matches[0];document.getElementById("hello").textContent=`${student.displayName} 학생, 마법모자가 기다리고 있습니다.`;show("intro")}
function nextQuestion(){if(qIndex>=questions.length){reveal();return}const item=questions[qIndex];document.getElementById("qno").textContent=`QUESTION ${String(qIndex+1).padStart(2,"0")} / 04`;document.getElementById("qtext").textContent=item.q;const box=document.getElementById("options");box.innerHTML="";item.a.forEach((t,i)=>{const b=document.createElement("div");b.className="option";b.textContent=t;b.onclick=()=>{answers.push(i);qIndex++;show("thinking");setTimeout(nextQuestion,650)};box.appendChild(b)});show("quiz")}
function reveal(){show("thinking");document.getElementById("thinkingText").textContent="네 운명은 이미 명부에 기록되어 있었다……";setTimeout(()=>{const d={"용지핀도르":{c:"🦁",q:"용기와 뜨거운 마음을 가진 자여. 용지핀도르가 당신을 환영합니다."},"일신데린":{c:"🐍",q:"야망과 지혜를 품은 자여. 일신데린에서 당신의 이야기가 시작됩니다."},"화홍클로":{c:"🦅",q:"지혜와 호기심을 가진 자여. 화홍클로의 높은 탑이 당신을 기다립니다."},"남제푸프":{c:"🦡",q:"우정과 성실함을 가진 자여. 남제푸프의 따뜻한 문이 당신에게 열립니다."}}[student.house];document.getElementById("houseCrest").textContent=d.c;document.getElementById("houseName").textContent=student.house;document.getElementById("houseQuote").textContent=d.q;document.getElementById("studentResult").textContent=`${student.grade}학년 ${student.displayName} 학생, 기숙사 배정이 완료되었습니다.`;show("result")},2200)}
</script></body></html>
