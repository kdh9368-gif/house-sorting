function begin(){const grade=document.getElementById("grade").value;const name=document.getElementById("name").value.trim().replace(/\s+/g,"");const err=document.getElementById("error");err.textContent="";if(!grade||!name){err.textContent="학년과 이름을 모두 입력해주세요.";return}
const matches=roster.filter(x=>x.grade===grade&&x.name.replace(/\s+/g,"")===name);if(matches.length===0){err.textContent="참여 명단에서 해당 학생을 찾을 수 없습니다. 학년과 이름을 확인해주세요.";return}if(matches.length>1){err.textContent="같은 학년의 동명이인이 있어 확인이 필요합니다.";return}student=matches[0];document.getElementById("hello").textContent=`${student.name} 학생, 마법모자가 기다리고 있습니다.`;show("intro")}
function nextQuestion(){if(qIndex>=questions.length){reveal();return}const item=questions[qIndex];document.getElementById("qno").textContent=`QUESTION ${String(qIndex+1).padStart(2,"0")} / 04`;document.getElementById("qtext").textContent=item.q;const box=document.getElementById("options");box.innerHTML="";item.a.forEach((t,i)=>{const b=document.createElement("div");b.className="option";b.textContent=t;b.onclick=()=>{answers.push(i);qIndex++;show("thinking");setTimeout(nextQuestion,650)};box.appendChild(b)});show("quiz")}
function reveal(){show("thinking");document.getElementById("thinkingText").textContent="네 운명은 이미 명부에 기록되어 있었다……";setTimeout(()=>{const d={"용지핀도르":{c:"🦁",q:"용기와 뜨거운 마음을 가진 자여. 용지핀도르가 당신을 환영합니다."},"일신데린":{c:"🐍",q:"야망과 지혜를 품은 자여. 일신데린에서 당신의 이야기가 시작됩니다."},"화홍클로":{c:"🦅",q:"지혜와 호기심을 가진 자여. 화홍클로의 높은 탑이 당신을 기다립니다."},"남제푸프":{c:"🦡",q:"우정과 성실함을 가진 자여. 남제푸프의 따뜻한 문이 당신에게 열립니다."}}[student.house];document.getElementById("houseCrest").textContent=d.c;document.getElementById("houseName").textContent=student.house;document.getElementById("houseQuote").textContent=d.q;document.getElementById("studentResult").textContent=`${student.grade}학년 ${student.name} 학생, 기숙사 배정이 완료되었습니다.`;show("result")},2200)}
</script></body></html>
